<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#080a0f" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>CITY OF CHAOS</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="err-overlay" style="display:none;position:fixed;top:0;left:0;right:0;padding:12px;background:#b91c1c;color:#fff;font-family:monospace;font-size:12px;z-index:99999;word-break:break-all;"></div>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('err-overlay');
        if (el) {
          el.style.display = 'block';
          el.innerText = 'Launch error: ' + (e.message || (e.error && e.error.message) || e);
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('err-overlay');
        if (el) {
          el.style.display = 'block';
          el.innerText = 'Promise rejection: ' + (e.reason && e.reason.message || e.reason);
        }
      });
    </script>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
