<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#080a0f" />
    <title>CITY OF CHAOS</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-prompt">
      <div class="rotate-card">
        <div class="rotate-phone-anim">
          <div class="phone-icon"></div>
        </div>
        <h1 class="rotate-title">CITY OF CHAOS</h1>
        <p class="rotate-sub">Rotate your phone to <strong>Landscape</strong> for the best open-world experience</p>
        <div class="rotate-actions">
          <button id="btn-fullscreen-landscape" class="btn-primary">PLAY FULLSCREEN</button>
          <button id="btn-portrait-dismiss" class="btn-secondary">Continue in Portrait</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
