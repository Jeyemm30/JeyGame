<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#080a0f" />
    <title>CITY OF CHAOS</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      @keyframes pulseBar {
        0% { opacity: 0.7; transform: scaleX(0.96); }
        50% { opacity: 1; transform: scaleX(1); }
        100% { opacity: 0.7; transform: scaleX(0.96); }
      }
    </style>
    <!-- Diagnostic error handler in head so any error during module parsing is captured -->
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('err-overlay');
        if (el) {
          el.style.display = 'block';
          el.innerText = 'Launch error: ' + (e.message || (e.error && e.error.message) || e);
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('err-overlay');
        if (el) {
          el.style.display = 'block';
          el.innerText = 'Promise rejection: ' + (e.reason && e.reason.message || e.reason);
        }
      });
    </script>
  </head>
  <body>
    <!-- Immediate HTML loading screen so players never see a black void while bundle downloads -->
    <div id="preloader" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#080b12;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:system-ui,-apple-system,sans-serif;color:#fff;user-select:none;pointer-events:none;">
      <div style="font-family:Impact,Arial Black,sans-serif;font-size:clamp(30px, 8vw, 54px);color:#ff8a3a;letter-spacing:3px;text-shadow:0 0 24px rgba(255,138,58,0.45);margin-bottom:6px;text-align:center;">CITY OF CHAOS</div>
      <div style="font-size:clamp(10px, 2.8vw, 13px);color:#8fd8e0;font-weight:bold;letter-spacing:4px;margin-bottom:28px;text-align:center;">OPEN-WORLD CITY SANDBOX</div>
      
      <div style="width:min(80vw, 320px);height:6px;background:#141a24;border-radius:3px;overflow:hidden;position:relative;margin-bottom:14px;border:1px solid #263346;">
        <div style="width:100%;height:100%;background:linear-gradient(90deg, #ff6a2a, #facc15);border-radius:3px;animation:pulseBar 1.2s infinite ease-in-out;"></div>
      </div>
      
      <div id="p-status" style="font-size:12px;color:#94a3b8;font-family:monospace;letter-spacing:1px;text-align:center;padding:0 16px;">Loading game...</div>
    </div>

    <!-- Error diagnostics banner -->
    <div id="err-overlay" style="display:none;position:fixed;top:0;left:0;right:0;padding:12px;background:#b91c1c;color:#fff;font-family:monospace;font-size:12px;z-index:99999;word-break:break-all;"></div>
    <script>
      (function() {
        var pStatus = document.getElementById('p-status');
        setTimeout(function() {
          if (pStatus && document.getElementById('preloader')) {
            pStatus.innerText = 'Connecting & downloading game...';
          }
        }, 3000);

        setTimeout(function() {
          if (pStatus && document.getElementById('preloader')) {
            pStatus.innerText = 'Still downloading (slow connection detected)...';
          }
        }, 12000);

        // Immediate cleanup watcher: if Menu is active, delete preloader immediately
        setInterval(function() {
          var p = document.getElementById('preloader');
          if (p && window.__game && window.__game.scene && window.__game.scene.scenes) {
            var menuScene = window.__game.scene.scenes.find(function(s) {
              return s && s.scene && s.scene.key === 'Menu' && s.scene.settings && s.scene.settings.status === 5;
            });
            if (menuScene) {
              try { p.remove(); } catch(e) {}
            }
          }
        }, 100);
      })();
    </script>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
